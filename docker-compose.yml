services:
  scylla:
    image: scylladb/scylla:5.4
    container_name: scylla_db
    ports:
      - "9042:9042"
      - "9160:9160"
      - "10000:10000"
    command: --smp 2 --memory 2G --overprovisioned 1 --api-address 0.0.0.0
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      - SCYLLA_ARGS=--log-to-stdout 1

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for Kafka to be ready...' &&
      sleep 5 &&
      echo 'Creating topics...' &&
      kafka-topics --create --if-not-exists --topic market-data-raw --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic market-data-1min --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic market-data-5min --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic market-data-daily --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic trading-signals --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic trading-orders --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic trading-fills --bootstrap-server kafka:9093 --partitions 3 --replication-factor 1 &&
      echo 'Listing topics:' &&
      kafka-topics --list --bootstrap-server kafka:9093 &&
      echo 'Topic creation completed!'
      "

volumes:
  scylla_data:
  postgres_data:
