# Тижневий дослідницький конвеєр (безкоштовний план):
#   1) докачує дані з публічного архіву data.binance.vision
#      (fapi REST з раннерів GitHub недоступний — США заблоковані, CDN працює);
#   2) переганяє стандартний набір стратегій (funding_ml, xs_carry, tsmom);
#   3) дописує рядок у RESEARCH_LOG.md і комітить дані+журнал назад у репо.
#
# Вартість: ~10-20 хв/тиждень із 2000 безкоштовних хвилин приватного репо.
# Без платіжної картки в акаунті списання неможливі (ліміт витрат $0).

name: research

on:
  schedule:
    - cron: "17 6 * * 1" # щопонеділка 06:17 UTC
  workflow_dispatch: {} # і вручну кнопкою

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Top-up data from data.binance.vision
        env:
          BACKFILL_DAYS: "30" # прогресивний бекфіл OI/long-short
        run: python3 scripts/topup_data.py

      # Сторож застою. fundingRate є ТІЛЬКИ місячними архівами (денної
      # категорії в data/futures/um/daily/ не існує), тож нормальний лаг —
      # до 31 дня. REST-дозбір закриває хвіст, але з US-раннерів fapi
      # заблокований, тож у CI він мовчки пропускається і свіжість тримається
      # локальними прогонами `python3 scripts/topup_data.py`.
      #
      # Поріг 40 днів ловить не лаг, а поломку: архів перестав публікуватись,
      # скрипт відвалився, або локальні дозбори припинились. Саме такий
      # мовчазний застій зробив рядки 07-13…07-27 копіями одного прогону.
      - name: Guard against stale funding data
        env:
          MAX_FUNDING_AGE_DAYS: "40"
        run: python3 scripts/topup_data.py --check-freshness

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: System deps (rdkafka cmake build)
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config libcurl4-openssl-dev libsasl2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin quant-backtest

      - name: Run research suite
        run: |
          set -o pipefail
          mkdir -p research_out
          ./target/release/quant-backtest \
            --funding-dir datasets/funding --strategy funding_ml \
            | tee research_out/funding_ml.txt
          ./target/release/quant-backtest \
            --funding-dir datasets/funding --strategy xs_carry \
            --top-k 10 --xs-trailing 63 --xs-rebalance 42 \
            | tee research_out/xs_carry.txt
          # Провалений гейт M2.1 валить бінарник ненульовим кодом (kill-критерій).
          # Тут це НЕ має обривати пайплайн: докачка даних, тіньовий журнал і
          # коміт мусять відпрацювати в будь-якому разі, інакше провалений гейт
          # заодно вбиває єдине джерело свіжих даних. Код відкладаємо і
          # піднімаємо останнім кроком, ПІСЛЯ коміту.
          # ГЕЙТ M2.1 — по ETF-кошику (акції/облігації/золото/товари), не по
          # крипті. Крипта як вимірювальний інструмент хитка: 8 монет ходять
          # як одна річ, розкид між відрізками 0.82 проти 0.39 у ETF, а медіана
          # стрибнула 0.642 → 1.037 від семи додаткових днів даних. Гиря, вага
          # якої змінюється при повторному зважуванні, — не гиря. ETF дає ще й
          # вшестеро довше OOS-вікно (1532 дні проти 651).
          #
          # --allow-short обов'язковий: TSMOM у Moskowitz–Ooi–Pedersen — це лонг
          # зростаючих І ШОРТ падаючих, і еталон 0.4–0.8 виміряний на повній
          # версії. Довга-тільки половина сліпа на ведмежому ринку і дає нуль
          # угод — гейт міряв би порожнечу.
          #
          # Провалений гейт валить бінарник ненульовим кодом; тут це НЕ має
          # обривати пайплайн — код відкладаємо і піднімаємо після коміту.
          gate_rc=0
          ./target/release/quant-backtest \
            --data-dir datasets/etf --strategy tsmom --walk-forward --allow-short \
            > research_out/tsmom_raw.txt 2>&1 || gate_rc=$?
          grep -vE "^📈|^🚀" research_out/tsmom_raw.txt > research_out/tsmom.txt || true
          cat research_out/tsmom.txt
          echo "$gate_rc" > research_out/m21_gate_rc

          # Крипта — ДОВІДКОВО. На гейт не впливає (|| true): це юніверс, який
          # ми торгуємо, і бачити його поруч корисно, але вимірювати ним движок
          # не можна. Логується окремою спробою, бо dataset входить у ключ
          # trial_sharpes (config_hash у обох прогонів однаковий).
          ./target/release/quant-backtest \
            --data-dir datasets/daily --strategy tsmom --walk-forward --allow-short \
            > research_out/tsmom_crypto_raw.txt 2>&1 || true
          grep -vE "^📈|^🚀" research_out/tsmom_crypto_raw.txt \
            > research_out/tsmom_crypto.txt || true
          cat research_out/tsmom_crypto.txt

      # Тіньовий трейдинг: ex-ante кошик тижня (базлайн + RF, A/B) у
      # shadow/ledger.jsonl + оцінка минулих тижнів. Git-таймстемп коміту
      # доводить, що кошик обрано ДО того, як тиждень відбувся.
      - name: Shadow ledger (ex-ante basket + evaluation)
        run: |
          ./target/release/quant-backtest \
            --funding-dir datasets/funding --strategy shadow_carry --top-k 10 \
            | tee research_out/shadow.txt

      # Дозбір funding-історії HTX (інкрементальний; живить жовтневе рішення
      # по HTX-live). УВАГА: невідомо, чи api.hbdm.com доступний з US-раннерів
      # (Binance fapi — ні) — continue-on-error, щоб гео-блок не валив research.
      # Результат дивитись у лозі цього кроку; commit-крок нижче підхоплює
      # datasets/funding_htx автоматично (git add datasets).
      - name: Top-up HTX funding history
        continue-on-error: true
        run: |
          cargo build --release --bin htx-exec
          ./target/release/htx-exec fetch-funding | tail -15

      - name: Append RESEARCH_LOG.md
        run: python3 scripts/summarize_run.py research_out RESEARCH_LOG.md

      - name: Commit results
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add datasets runs shadow RESEARCH_LOG.md
          if git diff --cached --quiet; then
            echo "Нових даних немає — коміт не потрібен."
          else
            git commit -m "research: weekly refresh $(date -u +%F) [skip ci]"
            git push
          fi

      # Kill-критерій M2.1 (GATE Фази 2). Стоїть ПІСЛЯ коміту навмисно: дані
      # за тиждень уже збережені, а прогін стає червоним — Фаза 3 формально
      # закрита, доки TSMOM не переживе корекцію на множинне тестування.
      - name: Enforce GATE M2.1
        run: |
          rc=$(cat research_out/m21_gate_rc 2>/dev/null || echo 0)
          if [ "$rc" != "0" ]; then
            echo "::error title=GATE M2.1::TSMOM не пройшов гейт — дивись вердикт у кроці «Run research suite». Дані за тиждень закомічені, але Фаза 3 закрита."
            exit 1
          fi
          echo "GATE M2.1 пройдено."
