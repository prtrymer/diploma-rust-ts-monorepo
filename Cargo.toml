[package]
name = "db-con"
version = "0.1.0"
edition = "2021"
default-run = "db-con"

[features]
default = []
polars-df = ["dep:polars"]
candle-ml = ["dep:candle-core"]

[dependencies]
tokio = { version = "1", features = ["full"] }
scylla = { version = "0.13", features = ["full-serialization"] }
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-trait = "0.1"
rust_decimal = { version = "1.33", features = ["maths"] }
rust_decimal_macros = "1.33"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
bigdecimal = "0.4"

# HTTP Server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
utoipa = { version = "4", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Data ingestion
reqwest = { version = "0.12", features = ["json"] }
yahoo_finance_api = "2.2"
futures = "0.3.32"
smartcore = "0.4"
polars = { version = "0.46", optional = true, default-features = false, features = ["csv"] }
candle-core = { version = "0.8", optional = true }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5.3"
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures-util = "0.3.32"
rand = "0.8"
rand_distr = "0.4"
urlencoding = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "db-con"
path = "src/main.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"
required-features = ["candle-ml"]

[[bin]]
name = "dataset-sync"
path = "src/bin/dataset_sync.rs"
required-features = ["polars-df"]

[[bin]]
name = "latency-bench"
path = "src/bin/latency_bench.rs"

[[bin]]
name = "quant-backtest"
path = "src/bin/quant_backtest.rs"
